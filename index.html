<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Intelligence</title>
  <style>
    :root { --bg:#08111f; --card:#111827; --muted:#94a3b8; --text:#f8fafc; --brand:#7c3aed; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, Arial, sans-serif; background: radial-gradient(circle at top right,#312e81,transparent 32%), var(--bg); color:var(--text); }
    main { max-width:1120px; margin:auto; padding:48px 20px; }
    .hero { display:grid; gap:18px; margin-bottom:28px; }
    .badge { width:max-content; padding:8px 12px; border:1px solid #334155; border-radius:999px; color:#c4b5fd; background:#ffffff0d; font-weight:700; font-size:13px; }
    h1 { font-size: clamp(38px,7vw,72px); line-height:.95; margin:0; letter-spacing:-0.06em; }
    p { color:var(--muted); font-size:18px; line-height:1.6; max-width:760px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
    .card { background:#ffffff0d; border:1px solid #ffffff1a; border-radius:28px; padding:24px; box-shadow:0 24px 80px #0008; }
    textarea { width:100%; min-height:260px; background:#020617; color:#e2e8f0; border:1px solid #334155; border-radius:20px; padding:18px; font:15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; resize:vertical; }
    button { border:0; background:linear-gradient(135deg,#8b5cf6,#22c55e); color:#061014; font-weight:900; border-radius:16px; padding:14px 18px; cursor:pointer; margin-top:14px; }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
    .metric { background:#020617; border:1px solid #1e293b; border-radius:20px; padding:16px; }
    .metric span { color:var(--muted); font-size:12px; font-weight:800; text-transform:uppercase; }
    .metric strong { display:block; margin-top:8px; font-size:24px; }
    .row { padding:14px 0; border-bottom:1px solid #ffffff12; }
    .row:last-child { border-bottom:0; }
    .label { color:var(--muted); font-size:13px; font-weight:800; text-transform:uppercase; }
    .value { margin-top:4px; font-size:18px; font-weight:800; }
    @media(max-width:800px){ .grid,.metrics { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="badge">Business Automation Demo</div>
      <h1>Invoice Intelligence</h1>
      <p>Paste invoice text and this browser app extracts useful business details into a clean dashboard. No backend needed.</p>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Invoice text</h2>
        <textarea id="input">Invoice #INV-2026-104
Vendor: Prae Technologies
Date: 2026-06-04
Due: 2026-06-18
Total: ₦480,000
Status: Pending
Service: AI dashboard prototype and UI implementation</textarea>
        <button onclick="analyze()">Analyze invoice</button>
      </div>
      <div class="card">
        <h2>Business summary</h2>
        <div class="metrics">
          <div class="metric"><span>Total</span><strong id="total">₦480,000</strong></div>
          <div class="metric"><span>Status</span><strong id="status">Pending</strong></div>
          <div class="metric"><span>Risk</span><strong id="risk">Medium</strong></div>
        </div>
        <div id="summary"></div>
      </div>
    </section>
  </main>
  <script>
    function find(pattern, fallback='Not found') {
      const text = document.getElementById('input').value;
      const match = text.match(pattern);
      return match ? match[1].trim() : fallback;
    }
    function analyze() {
      const vendor = find(/Vendor:\s*(.+)/i);
      const date = find(/Date:\s*(.+)/i);
      const due = find(/Due:\s*(.+)/i);
      const total = find(/Total:\s*(.+)/i, '₦0');
      const status = find(/Status:\s*(.+)/i, 'Review');
      const service = find(/Service:\s*(.+)/i, 'General service');
      document.getElementById('total').textContent = total;
      document.getElementById('status').textContent = status;
      document.getElementById('risk').textContent = status.toLowerCase().includes('overdue') ? 'High' : status.toLowerCase().includes('paid') ? 'Low' : 'Medium';
      document.getElementById('summary').innerHTML = [
        ['Vendor', vendor], ['Invoice Date', date], ['Due Date', due], ['Service', service], ['Recommended Action', status.toLowerCase().includes('paid') ? 'Archive receipt' : 'Schedule payment review']
      ].map(([a,b]) => `<div class="row"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('');
    }
    analyze();
  </script>
</body>
</html>
